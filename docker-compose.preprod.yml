name: ane-api-preprod
services:
  db:
    image: mysql:8.0.32
    container_name: ane_db_preprod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ane_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_preprod:/var/lib/mysql

  app:
    build: .
    container_name: ane_backend_preprod
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=preprod
    depends_on:
      - db

volumes:
  mysql_data_preprod: